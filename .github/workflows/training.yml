name: Training (CML report)

on:
  workflow_dispatch:
    inputs:
      n_trials:
        description: Optuna trials
        default: "20"
      use_synthetic_demo_data:
        description: Use the SYNTHETIC demo dataset (when no DVC remote is configured)
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  pull_request:
    paths:
      - "src/flightops_ml/training/**"
      - "src/flightops_ml/features/**"
      - "src/flightops_ml/data/**"
      - "configs/**"
      - "dvc.yaml"

# Least privilege: read the repo, comment on PRs. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Isolated, throw-away MLflow store. A laptop MLflow server is never exposed to CI.
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/ci_mlflow.db
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: iterative/setup-cml@v2
      - run: pip install -r requirements.txt dvc

      - name: Retrieve versioned data (DVC remote) or fall back to synthetic demo data
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
          DVC_REMOTE_USER: ${{ secrets.DVC_REMOTE_USER }}
          DVC_REMOTE_PASSWORD: ${{ secrets.DVC_REMOTE_PASSWORD }}
        run: |
          if [ -n "$DVC_REMOTE_URL" ] && [ -f data/raw/ai4i2020.csv.dvc ]; then
            dvc remote add -f -d ci "$DVC_REMOTE_URL"
            dvc remote modify --local ci user "$DVC_REMOTE_USER"
            dvc remote modify --local ci password "$DVC_REMOTE_PASSWORD"
            dvc pull data/raw/ai4i2020.csv.dvc
            echo "DATA_SOURCE=dvc" >> "$GITHUB_ENV"
          else
            python -m flightops_ml demo-data --out data/raw/ai4i2020_synthetic_demo.csv
            echo "FLIGHTOPS_DATASET=data/raw/ai4i2020_synthetic_demo.csv" >> "$GITHUB_ENV"
            echo "DATA_SOURCE=synthetic-demo" >> "$GITHUB_ENV"
          fi

      - name: Validate dataset
        run: python -m flightops_ml validate-data
      - name: Train candidates, evaluate, register (isolated MLflow)
        run: python -m flightops_ml train --trials "${{ github.event.inputs.n_trials || '20' }}" --trigger "ci:${{ github.event_name }}"
      - name: Build report
        run: |
          python -m flightops_ml cml-report
          echo "> Data source for this run: \`$DATA_SOURCE\`" | cat - reports/cml_report.md > reports/cml_report.tmp && mv reports/cml_report.tmp reports/cml_report.md
          cat reports/cml_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish CML report on the pull request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create --publish reports/cml_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            reports/evaluations
            reports/figures
            reports/cml_report.md
            ci_mlflow.db
